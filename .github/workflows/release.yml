name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish the installers under (leave empty to only upload build artifacts)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            args: --linux
          - name: macos
            os: macos-latest
            args: --mac --x64 --arm64
          - name: windows
            os: windows-latest
            args: --win

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Package
        shell: bash
        env:
          # Signing is optional. Add CSC_LINK (a base64-encoded .p12) and
          # CSC_KEY_PASSWORD as repository secrets to sign macOS builds, and
          # WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD for Windows ones.
          SIGN_MAC_CERT: ${{ secrets.CSC_LINK }}
          SIGN_MAC_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          SIGN_WIN_CERT: ${{ secrets.WIN_CSC_LINK }}
          SIGN_WIN_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # electron-builder reads CSC_LINK as a file path, so exporting it empty
          # is worse than leaving it unset: it resolves to the working directory
          # and the build dies with "not a file". Only export what is actually set.
          if [ -n "$SIGN_MAC_CERT" ]; then
            export CSC_LINK="$SIGN_MAC_CERT" CSC_KEY_PASSWORD="$SIGN_MAC_PASSWORD"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [ -n "$SIGN_WIN_CERT" ]; then
            export WIN_CSC_LINK="$SIGN_WIN_CERT" WIN_CSC_KEY_PASSWORD="$SIGN_WIN_PASSWORD"
          fi
          npx electron-builder ${{ matrix.args }} --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap

  release:
    name: Publish release
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
    steps:
      - uses: actions/checkout@v7

      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List what will be published
        run: ls -lh artifacts

      - name: Write the release notes
        run: |
          cat > notes.md <<'NOTES'
          Desktop builds for Linux, macOS and Windows.

          | Platform | Download |
          | --- | --- |
          | Linux | `.AppImage` (portable) or `.deb` |
          | macOS | `.dmg` — `-arm64` for Apple Silicon, `-x64` for Intel |
          | Windows | `-win-x64.exe` installer, or `-windows-portable.exe` |

          The installers are **not code-signed**.
          macOS: open it the first time with right-click -> Open, or run
          `xattr -dr com.apple.quarantine "/Applications/LG webOS Laptop Remote.app"`.
          Windows: SmartScreen -> More info -> Run anyway.
          NOTES

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* --title "$TAG" --notes-file notes.md
          fi
